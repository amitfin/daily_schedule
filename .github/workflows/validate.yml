name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs: # https://github.com/hacs/action
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install requirements
        run: scripts/setup

      - name: Python tests
        run: pytest

      - name: JS tests
        run: npm test

  test-minimum-ha:
    name: Tests (minimum HA version)
    runs-on: ubuntu-latest
    env:
      # Pins homeassistant==2026.7.0, the minimum in hacs.json. Update both together.
      PHCC_VERSION: "0.13.344"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements
        run: |
          python3 -m pip install uv --root-user-action ignore
          uv pip install --system "pytest-homeassistant-custom-component==${PHCC_VERSION}" home-assistant-frontend

      - name: Python tests
        run: pytest
